<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Discover skills that build your career with The Smart Worth. Join India's fastest growing platform for digital marketing, freelancing, and professional development courses." />
    <meta name="keywords" content="digital marketing course, freelancing, public speaking, chat gpt, online learning india, career growth, the smart worth" />
    <meta name="author" content="The Smart Worth" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://thesmartworth.site/" />
    <meta property="og:title" content="The Smart Worth | Best Online Learning Platform for Career Growth" />
    <meta property="og:description" content="Discover skills that build your career with The Smart Worth. Join India's fastest growing platform for digital marketing, freelancing, and professional development courses." />
    <meta property="og:image" content="https://i.postimg.cc/zBYXxpq0/Picsart-26-03-18-16-54-04-376.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://thesmartworth.site/" />
    <meta property="twitter:title" content="The Smart Worth | Best Online Learning Platform for Career Growth" />
    <meta property="twitter:description" content="Discover skills that build your career with The Smart Worth. Join India's fastest growing platform for digital marketing, freelancing, and professional development courses." />
    <meta property="twitter:image" content="https://i.postimg.cc/zBYXxpq0/Picsart-26-03-18-16-54-04-376.png" />

    <link rel="canonical" href="https://thesmartworth.site/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "The Smart Worth",
        "alternateName": ["TSW", "Smart Worth"],
        "url": "https://thesmartworth.site",
        "logo": "https://i.postimg.cc/zBYXxpq0/Picsart-26-03-18-16-54-04-376.png",
        "description": "The Smart Worth is an online learning platform for Creator Worth, Business Worth, Tech Worth, and Next Worth courses, packages, and e-books."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "The Smart Worth",
        "url": "https://thesmartworth.site",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://thesmartworth.site/courses?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Certificate & Brand Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@600;700;800;900&family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="fallback-ui" style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background: #F8F9FA; font-family: sans-serif;">
        <div style="text-align: center; padding: 2rem;">
          <div style="width: 40px; height: 40px; border: 3px solid #eee; border-top-color: #615DFA; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1.5rem;"></div>
          <h2 style="font-weight: 900; margin-bottom: 0.5rem; color: #0A0E27;">The Smart Worth</h2>
          <p style="color: #666; font-size: 0.9rem;">Starting application...</p>
          <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        </div>
      </div>
    </div>
    <script>
      // Fallback timer: If app doesn't mount in 20s (React fatal error fallback)
      window._app_timeout = setTimeout(function() {
        var fb = document.getElementById('fallback-ui');
        if (fb) {
          fb.innerHTML = '<div style="color: #0A0E27; font-weight: 900; margin-bottom: 0.5rem;">The Smart Worth</div>' +
                        '<div style="color: #64748b; font-size: 0.85rem; margin-bottom: 1.5rem;">The platform is taking a moment to initialize.</div>' +
                        '<div><button onclick="location.reload()" style="padding: 0.75rem 1.5rem; background: #615DFA; color: white; border: none; border-radius: 99px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 12px rgba(97,93,250,0.3);">Refresh Platform</button></div>';
        }
      }, 20000);
      
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error('[Startup Error]', msg, url, lineNo, columnNo, error);
        return false;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
